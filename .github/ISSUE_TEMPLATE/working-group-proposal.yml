name: Working Group Proposal
description: Propose a new Working Group or revive a Concluded Working Group under the AAIF.
title: "[Working Group Proposal] <ADD Proposed Name> "
labels: [New]
assignees:
  - christinaharter

body:
  - type: markdown
    attributes:
      value: |
        Thank you for your interest in forming or reviving an AAIF Working Group (WG). Please complete the form below for review by the Technical Committee (TC).

        Read the [Working Group Lifecycle Policy](https://github.com/aaif/technical-committee/blob/main/working-groups/lifecycle-policy.md) for eligibility, proposal requirements, approvals, and charter expectations, and the [Working Group Monthly Reporting](https://github.com/aaif/technical-committee/blob/main/working-groups/reporting.md) procedure for ongoing reporting requirements.

        The [Submission Guidelines](https://github.com/aaif/working-group-proposals/blob/main/submission-guidelines.md) provide practical advice for preparing your proposal. Consider whether a workstream within an existing WG would be a better fit for focused or time-boxed work.

        Proposals must be submitted by a representative of an AAIF member organization. Anyone may participate in a WG, but chairs must come from Platinum, Gold, or Silver member organizations.

        Review takes place asynchronously on this issue. Once the required TC and Governing Board approvals are in place, the WG starts in Sandbox and develops its charter. It becomes Active only after TC approval of the charter.

        For a revival, link to the Concluded WG's repository and previous charter in the supporting materials, and explain what has changed.

  - type: markdown
    attributes:
      value: "## Submitter Information"

  - type: input
    id: full_name
    attributes:
      label: Full name
      placeholder: Jane Doe
    validations:
      required: true

  - type: input
    id: email_address
    attributes:
      label: Email address
      placeholder: jane.doe@example.org
    validations:
      required: true

  - type: input
    id: organization
    attributes:
      label: Organization / Affiliation
      placeholder: Must be from an AAIF Member Organization
    validations:
      required: true

  - type: input
    id: role_title
    attributes:
      label: Role / Title
      placeholder: ex. Director of AI Standards
    validations:
      required: true

  - type: dropdown
    id: membership_tier
    attributes:
      label: Your organization's AAIF membership tier
      description: "Proposals may be submitted by people from any of these membership tiers. Non-members can ask a member organization to sponsor a proposal, with a member representative submitting it."
      options:
        - Platinum
        - Gold
        - Silver
        - Associate
    validations:
      required: true

  - type: dropdown
    id: willing_to_lead
    attributes:
      label: Are you willing to lead or co-lead this working group?
      description: "The proposer does not have to serve as a chair. Chair eligibility is defined in the Working Group Lifecycle Policy."
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Working Group Identity"

  - type: input
    id: working_group_name
    attributes:
      label: Proposed working group name
      placeholder: ex. Agentic AI Interoperability Working Group
    validations:
      required: true

  - type: input
    id: elevator_pitch
    attributes:
      label: One-sentence summary (elevator pitch, ~25 words max)
      placeholder: Define interoperable standards and best practices for agentic AI systems across tooling, governance, and deployment.
    validations:
      required: true

  - type: textarea
    id: focus_scope
    attributes:
      label: Detailed description of the working group's focus and scope
      placeholder: Describe the working group's focus, boundaries, and what it will and will not cover.
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Purpose & Justification"

  - type: textarea
    id: problem_statement
    attributes:
      label: Problem statement — what challenge or gap does this address?
      description: "Explain the gap in the agentic AI ecosystem and why no existing AAIF WG or external body already covers it."
      placeholder: What problem exists today, and why is it important to solve?
    validations:
      required: true

  - type: textarea
    id: relevance_to_agentic_ai
    attributes:
      label: Why is this relevant to Agentic AI specifically?
      placeholder: Explain why this issue is uniquely important in the context of agentic AI.
    validations:
      required: true

  - type: textarea
    id: goals_outcomes
    attributes:
      label: Proposed goals and intended outcomes
      placeholder: List the specific goals, outputs, or measurable outcomes expected from this working group.
    validations:
      required: true

  - type: textarea
    id: mission_alignment
    attributes:
      label: How does this align with the Agentic AI Foundation's mission?
      placeholder: Explain how this proposal supports the Foundation's strategic mission and priorities.
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Scope & Structure"

  - type: textarea
    id: key_topics
    attributes:
      label: Key topics or workstreams to be covered
      placeholder: |
        Example:
        - Technical standards
        - Governance frameworks
        - Evaluation benchmarks
        - Tooling and implementation guidance
    validations:
      required: true

  - type: textarea
    id: proposed_deliverables
    attributes:
      label: Proposed deliverables (e.g., whitepaper, standards, guidelines, tooling)
      description: "Describe what the WG expects to deliver in its first year, including the intended users and what completion would look like."
      placeholder: List the first-year outputs and proposed milestones.
    validations:
      required: true

  - type: input
    id: timeline_duration
    attributes:
      label: First-year delivery timeline
      description: "Outline delivery milestones for the first 12 months, not a fixed end date for the WG. Active WG charters are renewed annually under the lifecycle policy."
      placeholder: "First 6 months: initial draft; by month 12: publish the first deliverable."
    validations:
      required: true

  - type: input
    id: meeting_cadence
    attributes:
      label: Suggested meeting cadence
      description: "Active WGs meet at least monthly, in the open, and publish meeting notes."
      placeholder: Biweekly, monthly, etc.
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Membership & Stakeholders"

  - type: textarea
    id: co_chairs_smes
    attributes:
      label: Proposed chair and co-chair
      description: "Name both proposed chairs and provide each person's organization and AAIF membership tier. They must come from two different Platinum, Gold, or Silver member organizations. The TC confirms chair appointments under the lifecycle policy."
      placeholder: |
        Chair: name, organization, membership tier
        Co-chair: name, organization, membership tier
    validations:
      required: true

  - type: textarea
    id: target_participants
    attributes:
      label: Target participants / expertise needed
      description: "WG participation is open to everyone, including people from non-member organizations."
      placeholder: Describe the types of participants, domains, and expertise needed for this working group.
    validations:
      required: true

  - type: textarea
    id: committed_participants
    attributes:
      label: Committed participants from at least three organizations
      description: "Name the people who commit to taking part, their organizations, and their intended contributions. Include people from at least three organizations; participants do not have to come from AAIF member organizations."
      placeholder: List each committed participant's name, organization, and intended contribution.
    validations:
      required: true

  - type: input
    id: ideal_group_size
    attributes:
      label: Ideal working group size
      placeholder: 10-15 members
    validations:
      required: true

  - type: textarea
    id: cross_group_dependencies
    attributes:
      label: Overlap and coordination with AAIF WGs and external bodies
      description: "Identify adjacent AAIF WGs and external bodies or initiatives, and explain how the WG will coordinate with them rather than duplicate their work. If no overlap is identified, explain what you checked and why the scope is distinct."
      placeholder: "Group or body: related work, overlap, and proposed coordination."
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Impact & Prioritization"

  - type: textarea
    id: primary_beneficiaries
    attributes:
      label: Who are the primary beneficiaries of this work?
      placeholder: Identify the audiences, communities, or sectors that would benefit.
    validations:
      required: true

  - type: textarea
    id: anticipated_impact
    attributes:
      label: Anticipated impact (technical / policy / industry / societal)
      placeholder: Describe expected impact across relevant dimensions.
    validations:
      required: true

  - type: textarea
    id: urgency
    attributes:
      label: Urgency — why now?
      placeholder: Explain why this working group should be formed at this time.
    validations:
      required: true

  - type: textarea
    id: risks_challenges
    attributes:
      label: Are there risks or challenges to this working group succeeding?
      placeholder: List potential risks, blockers, or constraints.
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Resources"

  - type: textarea
    id: resource_needs
    attributes:
      label: Estimated resource needs (budget, tooling, staff support)
      placeholder: Describe expected budget, tools, staffing, or operational support needs.
    validations:
      required: false

  - type: textarea
    id: existing_work
    attributes:
      label: Existing work and supporting references (if any)
      description: "Link to work the WG would build on. Include overlap and coordination arrangements in the required field above."
      placeholder: Reference prior work, related standards, research, or adjacent efforts.
    validations:
      required: false

  - type: markdown
    attributes:
      value: "## Supporting Materials"

  - type: textarea
    id: supporting_documents
    attributes:
      label: "Supporting documents or attachments"
      placeholder: "Attach files to the issue after submission or include links below."
    validations:
      required: false

  - type: textarea
    id: references_links
    attributes:
      label: "Links to relevant references or resources"
      placeholder: "Add URLs to prior research, proposals, documents, repos, or other supporting materials."
    validations:
      required: false

  - type: textarea
    id: additional_comments
    attributes:
      label: Additional comments
      placeholder: Add any other context or notes here.
    validations:
      required: false

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I agree to follow the [AAIF Code of Conduct](https://github.com/aaif/foundation/blob/main/CODE_OF_CONDUCT.md).
          required: true
        - label: I understand that any supporting files must be attached after the issue is submitted, or linked in the form above.
          required: true
        - label: I confirm that the information provided here is accurate to the best of my knowledge.
          required: true
